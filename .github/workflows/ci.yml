name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install HyperFrames (Linux, for the lint test)
        if: runner.os == 'Linux'
        run: npm i -g hyperframes@0.8

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile all scripts
        run: python -m compileall -q skills tests

      - name: Validate plugin manifests
        run: |
          python -m json.tool .claude-plugin/plugin.json
          python -m json.tool .claude-plugin/marketplace.json

      - name: Run tests
        run: python -m pytest -v tests

  installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install.sh (syntax, dry run, real skills install)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh
          ./install.sh --dry-run --skills-only --agents=all
          ./install.sh --skills-only --agents=all
          for d in ~/.claude/skills ~/.codex/skills ~/.config/opencode/skills ~/.cursor/skills ~/.gemini/antigravity/skills; do
            test -f "$d/reelsmith-media/SKILL.md" && test -f "$d/whisper-tr/SKILL.md" && echo "ok $d"
          done
          mkdir -p /tmp/proj && cd /tmp/proj && "$GITHUB_WORKSPACE/install.sh" --skills-only --agents=claude,cursor --project
          test -f .claude/skills/reelsmith-media/SKILL.md && test -f .cursor/skills/reelsmith-media/SKILL.md

      - name: install.ps1 (parse, dry run, real skills install)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors; exit 1 }
          .\install.ps1 -DryRun -SkillsOnly -Agents all
          .\install.ps1 -SkillsOnly -Agents all
          foreach ($d in '.claude\skills', '.codex\skills', '.config\opencode\skills', '.cursor\skills', '.gemini\antigravity\skills') {
            foreach ($s in 'reelsmith-media', 'whisper-tr') {
              if (-not (Test-Path (Join-Path $HOME "$d\$s\SKILL.md"))) { throw "missing $d\$s" }
            }
            "ok $d"
          }

  render:
    name: End-to-end render (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg, espeak-ng and HyperFrames
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          npm i -g hyperframes@0.8

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Speak the test script
        run: espeak-ng -v en-us -s 140 -w voice.wav "This green stone comes from deep inside the Earth. Volcanoes carry its crystals up to the surface."

      - name: Whisper, align, build, render, verify
        run: python tests/e2e_render.py voice.wav --language=en
